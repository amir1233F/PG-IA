<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PG-AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#080b12;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:70px;
    background:#0d111a;
    border-bottom:1px solid #202735;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.logo{
    font-size:23px;
    font-weight:bold;
    color:#7c5cff;
}

.status{
    font-size:12px;
    color:#65e6a5;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:25px 15px 120px;
}

.welcome{
    text-align:center;
    margin-top:12vh;
}

.welcome h1{
    font-size:35px;
    margin-bottom:12px;
    background:linear-gradient(90deg,#7c5cff,#36c8ff);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    color:#9299a8;
    font-size:15px;
}

.message{
    max-width:850px;
    margin:15px auto;
    padding:14px 17px;
    border-radius:17px;
    line-height:1.9;
    white-space:pre-wrap;
}

.user{
    background:#151b29;
    border:1px solid #252d3d;
}

.ai{
    background:#0d1420;
    border:1px solid #202a3a;
}

.label{
    font-size:12px;
    color:#8d7cff;
    margin-bottom:5px;
    font-weight:bold;
}

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:linear-gradient(transparent,#080b12 25%);
    padding:20px 15px;
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:8px;
    background:#111722;
    border:1px solid #293244;
    border-radius:18px;
    padding:8px;
}

textarea{
    flex:1;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-family:inherit;
    font-size:15px;
    padding:10px;
    height:45px;
}

textarea::placeholder{
    color:#697181;
}

button{
    width:45px;
    height:45px;
    border:0;
    border-radius:13px;
    background:#7357ff;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

@media(max-width:600px){
    header{
        height:60px;
    }

    .welcome h1{
        font-size:30px;
    }

    .message{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">PG-AI</div>
    <div class="status">● آماده</div>
</header>

<main class="chat" id="chat">

    <div class="welcome" id="welcome">
        <h1>PG-AI</h1>
        <p>دستیار هوش مصنوعی شما</p>
    </div>

</main>

<div class="input-area">
    <div class="input-box">

        <textarea
            id="message"
            placeholder="پیامت رو بنویس..."
            onkeydown="handleKey(event)"
        ></textarea>

        <button onclick="sendMessage()">➤</button>

    </div>
</div>

</div>

<script>

function handleKey(event){
    if(event.key === "Enter" && !event.shiftKey){
        event.preventDefault();
        sendMessage();
    }
}

function sendMessage(){

    const input = document.getElementById("message");
    const text = input.value.trim();

    if(!text) return;

    const welcome = document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    addMessage("شما", text, "user");

    input.value = "";

    setTimeout(function(){

        let answer = "";

        if(text.includes("سلام")){
            answer = "سلام 👋\nبه PG-AI خوش اومدی!";
        }
        else if(text.includes("اسم")){
            answer = "من PG-AI هستم 🤖";
        }
        else if(text.includes("خوبی")){
            answer = "مرسی 😎 آماده‌ام کمکت کنم.";
        }
        else{
            answer = "پیامت دریافت شد ✅\n\nفعلاً این نسخه آزمایشی PG-AI است. برای پاسخ‌های واقعی هوش مصنوعی باید بعداً یک سرویس AI به سایت متصل شود.";
        }

        addMessage("PG-AI", answer, "ai");

    },500);
}

function addMessage(name,text,type){

    const chat = document.getElementById("chat");

    const box = document.createElement("div");
    box.className = "message " + type;

    box.innerHTML =
        '<div class="label">' +
        name +
        '</div>' +
        escapeHTML(text);

    chat.appendChild(box);

    chat.scrollTop = chat.scrollHeight;
}

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;")
        .replace(/\n/g,"<br>");

}

</script>

</body>
</html>
